# 自动测试守护 —— 红灯不合并（M4）
#
# 跑 L1 全链：lint + vitest(契约/单元/持久化) + 引擎冒烟 + 面板构建渲染。
# 任一步红灯则整个 PR 失败，拦截合并（对应需求 #20/#21）。

name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm install --no-audit --no-fund || npm install --no-audit --no-fund --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Unit + contract + persistence tests
        run: npm run test

      - name: Engine smoke (15/15)
        run: npm run smoke

      - name: Panel build + render smoke
        run: npm run verify:panel
